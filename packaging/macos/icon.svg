<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Иконка приложения. Сетка macOS: в холсте 1024 плитка занимает 824 со
    скруглением 185.4, остальное — прозрачные поля, которыми система
    выравнивает иконки между собой. Тень и блик по кромке нарисованы здесь:
    классический .icns система рисует буквально и ничего не добавляет.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2532"/>
      <stop offset="1" stop-color="#070A0E"/>
    </linearGradient>
    <linearGradient id="cone" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#26506F"/>
      <stop offset="0.38" stop-color="#9CC9E8"/>
      <stop offset="0.62" stop-color="#C8E4F7"/>
      <stop offset="1"    stop-color="#22465F"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#6E8497"/>
      <stop offset="0.5" stop-color="#C2D3E2"/>
      <stop offset="1"   stop-color="#5D7286"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F0F8FF"/>
      <stop offset="1" stop-color="#8CBADC"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6FD9FF" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#3FA8D8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#FFFFFF" stop-opacity="0.55"/>
      <stop offset="0.28" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="0.62" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1"    stop-color="#FFFFFF" stop-opacity="0.09"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <clipPath id="tile">
      <rect x="100" y="100" width="824" height="824" rx="185.4"/>
    </clipPath>
  </defs>

  <rect x="100" y="108" width="824" height="824" rx="185.4"
        fill="#000000" opacity="0.45" filter="url(#drop)"/>
  <rect x="100" y="100" width="824" height="824" rx="185.4" fill="url(#bg)"/>

  <g clip-path="url(#tile)">
    <g transform="translate(512 512) scale(0.919643) translate(-512 -512)">
      <!-- Факел: расширяется вдоль тела и уходит вниз. -->
      <path d="M 292 392 L 176 896 L 848 896 L 732 392 Z"
            fill="url(#glow)" filter="url(#soft)" opacity="0.8"/>

      <!-- Центральное тело: конус от критики к усечённому основанию. -->
      <path d="M 334 344
               C 356 556, 452 742, 500 826
               L 524 826
               C 572 742, 668 556, 690 344 Z" fill="url(#cone)"/>
      <ellipse cx="512" cy="826" rx="12" ry="4" fill="#1D3E57"/>

      <!-- Обечайка и кольцевая критика вокруг тела. -->
      <ellipse cx="512" cy="344" rx="234" ry="66" fill="url(#rim)"/>
      <ellipse cx="512" cy="344" rx="196" ry="55" fill="#121B24"/>
      <ellipse cx="512" cy="344" rx="178" ry="49" fill="url(#top)"/>
    </g>
  </g>

  <rect x="102.5" y="102.5" width="819" height="819" rx="182.9"
        fill="none" stroke="url(#gloss)" stroke-width="5"/>
</svg>
