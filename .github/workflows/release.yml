name: Release

# Бинарники собираются по тегу вида v0.1.0 и прикладываются к релизу.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Системные библиотеки для окна
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev \
            libxrandr-dev libxi-dev libxcursor-dev libgl1-mesa-dev
            
      - run: cargo build --release --workspace --target ${{ matrix.target }}

      - name: Упаковать (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/igla dist/
          cp target/${{ matrix.target }}/release/igla-gui dist/
          cp README.md LICENSE dist/
          cp -r docs dist/
          tar -czf igla-${{ matrix.target }}.tar.gz -C dist .

      - name: Упаковать (macOS)
        if: runner.os == 'macOS'
        run: |
          set -eu
          # .app — это просто каталог с фиксированной раскладкой. Версия
          # подставляется из тега, чтобы в релизе не оказалось прошлогодней.
          if [ "$GITHUB_REF_TYPE" = tag ]; then VERSION="${GITHUB_REF_NAME#v}"; else VERSION="0.0.0-dev"; fi
          APP="dist/Igla.app"
          RES="$APP/Contents/Resources"
          mkdir -p "$APP/Contents/MacOS" "$RES"
          sed "s/__VERSION__/$VERSION/g" packaging/macos/Info.plist > "$APP/Contents/Info.plist"

          # Слоёная иконка: actool собирает Assets.car для macOS 26+ (там
          # материал Liquid Glass накладывает система) и заодно совместимый
          # .icns для более ранних версий. Если actool споткнётся, релиз не
          # падает — кладём нарисованный вручную .icns.
          if xcrun actool packaging/macos/AppIcon.icon \
               --app-icon AppIcon --compile iconout \
               --output-partial-info-plist iconout/partial.plist \
               --minimum-deployment-target 11.0 \
               --platform macosx --target-device mac \
               --errors --warnings; then
            cp iconout/Assets.car "$RES/" 2>/dev/null || true
            GENERATED=$(find iconout -name '*.icns' | head -1)
            if [ -n "$GENERATED" ]; then cp "$GENERATED" "$RES/AppIcon.icns"; fi
          else
            echo "::warning::actool не собрал AppIcon.icon — беру запасной .icns"
          fi
          [ -f "$RES/AppIcon.icns" ] || cp packaging/macos/igla.icns "$RES/AppIcon.icns"

          cp target/${{ matrix.target }}/release/igla-gui "$APP/Contents/MacOS/"
          cp target/${{ matrix.target }}/release/igla dist/
          cp README.md LICENSE dist/
          cp -r docs dist/
          tar -czf igla-${{ matrix.target }}.tar.gz -C dist .

      - name: Упаковать (windows)
        if: runner.os == 'Windows'
        run: |
          mkdir dist
          copy target\${{ matrix.target }}\release\igla.exe dist\
          copy target\${{ matrix.target }}\release\igla-gui.exe dist\
          copy README.md dist\
          copy LICENSE dist\
          xcopy docs dist\docs\ /E /I
          Compress-Archive -Path dist\* -DestinationPath igla-${{ matrix.target }}.zip
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: igla-${{ matrix.target }}
          path: |
            igla-*.tar.gz
            igla-*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            igla-*.tar.gz
            igla-*.zip
