name: Release

# Бинарники собираются по тегу вида v0.1.0 и прикладываются к релизу.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Системные библиотеки для окна
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev \
            libxrandr-dev libxi-dev libxcursor-dev libgl1-mesa-dev
      - run: cargo build --release --workspace --target ${{ matrix.target }}

      - name: Упаковать (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/igla dist/
          cp target/${{ matrix.target }}/release/igla-gui dist/
          cp README.md LICENSE dist/
          cp -r docs dist/
          tar -czf igla-${{ matrix.target }}.tar.gz -C dist .
      - name: Упаковать (windows)
        if: runner.os == 'Windows'
        run: |
          mkdir dist
          copy target\${{ matrix.target }}\release\igla.exe dist\
          copy target\${{ matrix.target }}\release\igla-gui.exe dist\
          copy README.md dist\
          copy LICENSE dist\
          xcopy docs dist\docs\ /E /I
          Compress-Archive -Path dist\* -DestinationPath igla-${{ matrix.target }}.zip
        shell: pwsh

      - uses: actions/upload-artifact@v4
        with:
          name: igla-${{ matrix.target }}
          path: |
            igla-*.tar.gz
            igla-*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            igla-*.tar.gz
            igla-*.zip
