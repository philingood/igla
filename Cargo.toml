[workspace]
members = ["crates/igla-core", "crates/igla-cli", "crates/igla-gui"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/philingood/igla"

[workspace.dependencies]
igla-core = { path = "crates/igla-core" }

[profile.release]
lto = "thin"
strip = true
